<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Live GPS Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #map {
      flex: 1;
    }
    #dataBox {
      padding: 12px;
      background: #f0f0f0;
      border-bottom: 1px solid #ccc;
    }
  </style>
</head>
<body>

<div id="dataBox">
  <h3>Live GPS Coordinates</h3>
  <p>Latitude: <span id="lat">Waiting...</span></p>
  <p>Longitude: <span id="lng">Waiting...</span></p>
</div>

<div id="map"></div>

<script>
  // Replace with your Firebase Realtime Database URL
  const databaseURL = "https://YOUR-PROJECT-ID.firebaseio.com/gps.json";

  let map, marker;

  function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 14.0, lng: 121.0 },
      zoom: 15
    });

    marker = new google.maps.Marker({
      position: { lat: 14.0, lng: 121.0 },
      map: map,
      title: "GPS Location"
    });

    listenForGPS();
  }

  function listenForGPS() {
    setInterval(() => {
      fetch(databaseURL)
        .then(res => res.json())
        .then(data => {
          if (!data) return;
          document.getElementById("lat").textContent = data.lat;
          document.getElementById("lng").textContent = data.lng;

          const pos = { lat: data.lat, lng: data.lng };
          marker.setPosition(pos);
          map.setCenter(pos);
        });
    }, 1500);
  }
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAF0SAUKSckNlmevYBRG3vaFw_w3uCixtw&callback=initMap" async defer></script>

</body>
</html>
