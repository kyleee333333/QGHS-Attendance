<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d2b"><link rel="manifest" href="manifest.webmanifest"><title>QGHS CONNECT</title>
<style>
:root{--g:#123d2b;--g2:#246344;--bg:#f3f6f2;--line:#e1e8e0;--muted:#68766e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#18251d;font:15px system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:225px 1fr}.side{background:var(--g);color:white;padding:24px 14px;display:flex;flex-direction:column;gap:26px}.brand{font-weight:850;font-size:16px;padding:0 10px}.brand small{display:block;color:#bed3c4;font-weight:400;font-size:12px}.nav{display:grid;gap:6px}.nav button{border:0;border-radius:9px;background:transparent;color:#d9e6dd;text-align:left;padding:12px}.nav button.active,.nav button:hover{background:#ffffff20;color:#fff}.foot{margin-top:auto;color:#b8d0c1;font-size:11px;padding:10px}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:17px 28px;display:flex;justify-content:space-between;align-items:center}.top small{color:var(--muted)}.content{padding:26px;max-width:1300px;margin:auto}.head{display:flex;justify-content:space-between;gap:14px;align-items:start;margin-bottom:18px}.head h2{margin:0 0 5px;font-size:25px}.head p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);border-radius:9px;background:white;padding:9px 13px;font-weight:650}.primary{background:var(--g2);color:#fff;border-color:var(--g2)}.notice{padding:12px 14px;border:1px solid #ecdcae;background:#fff6df;border-radius:10px;color:#75500e;font-size:12px;margin-bottom:17px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:17px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;min-width:0}.stat{color:var(--muted);font-size:12px}.stat b{display:block;font-size:29px;color:#17231d;margin:7px 0}.muted{color:var(--muted);font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0}.search,input,select{border:1px solid #dce4dc;border-radius:9px;padding:10px;background:white;max-width:100%}.search{width:320px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;white-space:nowrap;background:#fff}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf1ed;font-size:12px}th{background:#f8faf7;color:#66746a;font-size:10px;text-transform:uppercase}tr:last-child td{border-bottom:0}.badge{display:inline-block;border-radius:20px;padding:4px 8px;background:#e5f3e4;color:#28633b;font-size:11px;font-weight:750}.warn{background:#fff0d4;color:#87530b}.alert{background:#fde8e8;color:#a52d2d}.fields{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.fields input,.fields select{min-width:130px}.empty{padding:20px;text-align:center;color:var(--muted)}.toast{display:none;position:fixed;bottom:18px;right:18px;background:var(--g);color:white;border-radius:10px;padding:12px 16px}.toast.show{display:block}@media(max-width:900px){.app{grid-template-columns:180px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:18px}.two{grid-template-columns:1fr}}@media(max-width:650px){.app{display:block}.side{padding:12px;gap:12px}.nav{grid-template-columns:repeat(2,1fr)}.nav button{padding:8px;font-size:12px}.foot{display:none}.top{padding:12px 16px}.content{padding:14px}.head h2{font-size:21px}.stats{gap:8px}.card{padding:13px}.search{width:100%}}
</style></head><body><div class="app"><aside class="side"><div class="brand">QGHS CONNECT<small>School management</small></div><nav class="nav" id="nav"><button class="active" data-page="dashboard">▦ Overview</button><button data-page="students">♙ Students</button><button data-page="attendance">◉ Attendance & Scan</button><button data-page="risk">⌁ Early Warning</button><button data-page="announcements">▤ Announcements</button><button data-page="reports">▥ Reports & Audit</button><button data-page="settings">⚙ Settings</button></nav><div class="foot">Quirino General High School<br>Prototype · Demo data only</div></aside><main class="main"><header class="top"><div><small>QGHS / CONNECT</small><div id="title"><b>Overview</b></div></div><span class="badge warn">● SIMULATION MODE</span></header><div class="content" id="content"></div></main></div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const KEY='qghs-connect-demo-v1',seed=[
{id:'QG-1001',name:'Angela Mae Santos',grade:'11',section:'STEM - A',attendance:96,absences:1},
{id:'QG-1002',name:'Joshua Miguel Reyes',grade:'11',section:'STEM - A',attendance:82,absences:5},
{id:'QG-1003',name:'Sofia Claire Dela Cruz',grade:'10',section:'Grade 10 - Rizal',attendance:91,absences:3},
{id:'QG-1004',name:'Mark John Villanueva',grade:'12',section:'ICT - B',attendance:74,absences:8},
{id:'QG-1005',name:'Patricia Anne Mendoza',grade:'9',section:'Grade 9 - Mabini',attendance:98,absences:0}];
let data;try{data=JSON.parse(localStorage.getItem(KEY))||{students:seed,events:[],announcements:[],audit:[],lateAfter:'07:30'}}catch{data={students:seed,events:[],announcements:[],audit:[],lateAfter:'07:30'}}
let page='dashboard',query='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function msg(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2300)}
function log(action,detail){data.audit.unshift({action,detail,time:new Date().toISOString()});data.audit=data.audit.slice(0,150);save()}
function today(){return data.events.filter(e=>new Date(e.time).toDateString()===new Date().toDateString())}
function score(s){return Math.min(100,Math.round(Number(s.absences||0)*7+Math.max(0,85-Number(s.attendance||100))*1.5))}
function risk(s){let n=score(s);return n>=60?'<span class="badge alert">High attention</span>':n>=30?'<span class="badge warn">Needs review</span>':'<span class="badge">On track</span>'}
function time(t){return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function title(t,sub,btn=''){return '<div class="head"><div><h2>'+t+'</h2><p>'+sub+'</p></div>'+btn+'</div>'}
function stat(t,n,s){return '<div class="card"><div class="stat">'+t+'</div><b>'+n+'</b><div class="muted">'+s+'</div></div>'}
function table(rows){if(!rows.length)return '<div class="empty">No records yet.</div>';return '<div class="tablewrap"><table><thead><tr><th>Student ID</th><th>Name</th><th>Event</th><th>Time</th><th>Status</th></tr></thead><tbody>'+rows.map(e=>{let s=data.students.find(x=>x.id===e.id);return '<tr><td>'+esc(e.id)+'</td><td>'+esc(s?.name||'Unknown')+'</td><td>'+esc(e.type)+'</td><td>'+time(e.time)+'</td><td><span class="badge '+(e.late?'warn':'')+'">'+(e.late?'Late':'Recorded')+'</span></td></tr>'}).join('')+'</tbody></table></div>'}
function dashboard(){let ev=today(),present=new Set(ev.filter(e=>e.type==='Entrance').map(e=>e.id)).size;return title('Good day, Administrator 👋','Your school attendance snapshot.','<button class="btn primary" data-go="attendance">＋ Simulate scan</button>')+'<div class="notice"><b>Demo only:</b> the app stores records in this browser. Do not enter real student data. Fingerprint scans are simulated; there is no production database or login yet.</div><div class="stats">'+stat('Students',data.students.length,'Demo directory')+stat('Scanned in today',present,'Entrance events')+stat('Events today',ev.length,'Entrance and exit')+stat('High-attention flags',data.students.filter(s=>score(s)>=60).length,'Needs staff review')+'</div><div class="two"><section class="card"><h3>Recent activity</h3>'+table(data.events.slice(-5).reverse())+'</section><section class="card"><h3>Prototype status</h3><p>✓ Responsive website</p><p>✓ Student demo records</p><p>✓ Simulated attendance</p><p>✓ CSV export and local audit</p><p>○ Secure backend and database</p><p>○ Real fingerprint hardware</p><p>○ Android package</p></section></div>'}
function students(){let list=data.students.filter(s=>(s.id+s.name+s.section+s.grade).toLowerCase().includes(query.toLowerCase()));return title('Student records','Manage sample student profiles.','<button class="btn primary" id="add">＋ Add student</button>')+'<div class="notice">Use fictional records only. Changes are stored locally in this browser.</div><section class="card"><div class="toolbar"><input class="search" id="search" placeholder="Search student…" value="'+esc(query)+'"><span class="muted">'+list.length+' records</span></div><div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Grade</th><th>Section</th><th>Attendance</th><th>Risk</th><th></th></tr></thead><tbody>'+list.map(s=>'<tr><td>'+esc(s.id)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.grade)+'</td><td>'+esc(s.section)+'</td><td>'+s.attendance+'%</td><td>'+risk(s)+'</td><td><button class="btn" data-edit="'+esc(s.id)+'">Edit</button></td></tr>').join('')+'</tbody></table></div></section>'}
function attendance(){return title('Attendance & scan','Simulate entrance or exit attendance events.')+'<div class="notice"><b>Simulation:</b> no biometric sensor is connected. The event is created by the button and is not proof of fingerprint identity.</div><section class="card"><h3>Virtual fingerprint terminal</h3><div class="fields"><select id="student">'+data.students.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.id+' · '+s.name)+'</option>').join('')+'</select><select id="event"><option>Entrance</option><option>Exit</option></select><button class="btn primary" id="scan">◉ Simulate scan</button></div><p class="muted">Late threshold: '+esc(data.lateAfter||'07:30')+' local device time.</p></section><section class="card"><div class="toolbar"><h3>Today's scans</h3><button class="btn" id="export">Export CSV</button></div>'+table(today().slice().reverse())+'</section>'}
function warning(){let list=data.students.slice().sort((a,b)=>score(b)-score(a));return title('Early Warning System','Transparent attendance indicators for staff review.')+'<div class="notice"><b>Rule-based demo, not trained AI.</b> Score uses sample absences and attendance percentage. It must not make disciplinary, grading, or enrollment decisions. Staff must verify context.</div><section class="card"><h3>Attendance risk indicators</h3>'+list.map(s=>'<div style="padding:13px 0;border-bottom:1px solid var(--line)"><b>'+esc(s.name)+'</b> · '+risk(s)+'<p class="muted">'+esc(s.id)+' · '+s.absences+' absences · '+s.attendance+'% attendance · score '+score(s)+'</p><button class="btn" data-review="'+esc(s.id)+'">Log staff review</button></div>').join('')+'</section>'}
function announcements(){return title('Announcements','Messages stored in this browser.','<button class="btn primary" id="announce">＋ New message</button>')+'<div class="notice">SMS, email, push notifications and guardian delivery are not connected.</div><section class="card">'+(data.announcements.slice().reverse().map(a=>'<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>'+esc(a.title)+'</b><p>'+esc(a.body)+'</p><small class="muted">'+new Date(a.time).toLocaleString()+'</small></div>').join('')||'<div class="empty">No announcements yet.</div>')+'</section>'}
function reports(){return title('Reports & audit','Review attendance events and export a CSV.','<button class="btn primary" id="export">↓ Export CSV</button>')+'<div class="card"><h3>Attendance history</h3>'+table(data.events.slice().reverse())+'</div><div class="card"><h3>Audit trail</h3>'+((data.audit||[]).map(a=>'<p><b>'+esc(a.action)+'</b> — '+esc(a.detail)+' <small class="muted">'+new Date(a.time).toLocaleString()+'</small></p>').join('')||'<div class="empty">No audit entries yet.</div>')+'</div>'}
function settings(){return title('Settings','Configure demo attendance rules.')+'<section class="card"><label>School name <input id="school" value="Quirino General High School"></label><p><label>Late threshold <input id="late" type="time" value="'+esc(data.lateAfter||'07:30')+'"></label></p><button class="btn primary" id="saveSettings">Save settings</button><hr><p class="muted">Authentication: not implemented · Database: localStorage only · Fingerprint: simulation · Hosting: not configured.</p><button class="btn" id="reset">Reset demo records</button></section>'}
function render(){let map={dashboard,students,attendance,risk:warning,announcements,reports,settings};$('#content').innerHTML=(map[page]||dashboard)();$('#title').innerHTML='<b>'+({dashboard:'Overview',students:'Student Records',attendance:'Attendance & Scan',risk:'Early Warning System',announcements:'Announcements',reports:'Reports & Audit',settings:'System Settings'}[page])+'</b>';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));bind()}
function csv(){let lines=[['Student ID','Student Name','Event','Timestamp','Late','Source'],...data.events.map(e=>[e.id,data.students.find(s=>s.id===e.id)?.name||'Unknown',e.type,e.time,e.late?'Yes':'No','SIMULATED'])];let blob=new Blob(['\ufeff'+lines.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='qghs-connect-attendance.csv';a.click();URL.revokeObjectURL(u)}
function edit(id){let s=data.students.find(x=>x.id===id),name=prompt('Student name:',s?.name||'');if(name===null||!name.trim())return;let grade=prompt('Grade:',s?.grade||'11');if(grade===null)return;let section=prompt('Section:',s?.section||'');if(section===null)return;let abs=Number(prompt('Demo absences:',s?.absences||0)),att=Number(prompt('Attendance percentage:',s?.attendance??100));if(s)Object.assign(s,{name:name.trim(),grade,section,absences:Math.max(0,abs||0),attendance:Math.min(100,Math.max(0,att||0))});else data.students.push({id:'QG-'+Date.now().toString().slice(-6),name:name.trim(),grade,section,absences:Math.max(0,abs||0),attendance:Math.min(100,Math.max(0,att||0))});log(s?'Student updated':'Student added',name);save();render()}
function bind(){let se=$('#search');if(se)se.oninput=e=>{query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(query.length,query.length)};let add=$('#add');if(add)add.onclick=()=>edit(null);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));let scan=$('#scan');if(scan)scan.onclick=()=>{let id=$('#student').value,type=$('#event').value,now=new Date(),t=(data.lateAfter||'07:30').split(':').map(Number),late=type==='Entrance'&&(now.getHours()>t[0]||(now.getHours()===t[0]&&now.getMinutes()>t[1]));if(today().some(e=>e.id===id&&e.type===type)){msg('That event is already recorded today.');return}data.events.push({id,type,time:now.toISOString(),late});log('Simulated scan',id+' '+type+(late?' late':''));save();render();msg('Simulation event saved. No fingerprint was read.')};let ex=$('#export');if(ex)ex.onclick=csv;let an=$('#announce');if(an)an.onclick=()=>{let title=prompt('Announcement title:');if(!title?.trim())return;let body=prompt('Message:');if(!body?.trim())return;data.announcements.push({title,body,time:new Date().toISOString()});log('Announcement created',title);save();render()};document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{let s=data.students.find(x=>x.id===b.dataset.review);log('Staff review logged',s.name+' score '+score(s));save();msg('Review logged locally.');render()});let ss=$('#saveSettings');if(ss)ss.onclick=()=>{data.lateAfter=$('#late').value||'07:30';save();log('Settings updated','Late threshold '+data.lateAfter);render();msg('Settings saved.')};let reset=$('#reset');if(reset)reset.onclick=()=>{if(confirm('Reset demo records to initial sample data?')){localStorage.removeItem(KEY);location.reload()}}}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;query='';render()}});render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
